<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07080a" />
    <meta
      name="description"
      content="sen: catorce ambientes de luz y sonido para descansar. Sesiones de diez minutos."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="sen" />
    <title>sen</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="src/styles/main.css" />
  </head>
  <body>
    <canvas class="menu-canvas" id="menu-canvas" aria-hidden="true"></canvas>
    <div class="menu-shade" aria-hidden="true"></div>

    <main class="app" id="app">
      <header class="brand">
        <span class="brand__mark">sen</span>
      </header>

      <h1 class="sr-only">sen — elige un ambiente de luz y sonido para diez minutos</h1>

      <div class="constellation" id="constellation">
        <svg class="constellation__lines" id="constellation-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="nodes" id="grid" role="group" aria-label="Elige un ambiente"></div>
      </div>

      <footer class="foot">
        <span id="ambient-count">14 ambientes</span>
        <span class="foot__dot" aria-hidden="true"></span>
        <span>10 min</span>
        <span class="foot__dot" aria-hidden="true"></span>
        <a class="foot__lab" href="sounds/">laboratorio</a>
      </footer>

      <noscript>
        <p class="noscript">sen necesita JavaScript para reproducir luz y sonido.</p>
      </noscript>
    </main>

    <section
      class="stage"
      id="stage"
      role="dialog"
      aria-modal="true"
      aria-label="Sesión"
      aria-hidden="true"
      tabindex="-1"
      hidden
    >
      <canvas class="stage__canvas" id="canvas" aria-hidden="true"></canvas>
      <div class="stage__vignette" aria-hidden="true"></div>
      <div class="stage__progress" aria-hidden="true"><span id="progress"></span></div>
      <div class="stage__dim" id="dim" aria-hidden="true"></div>

      <p class="stage__note" id="note" hidden>Audio no disponible</p>
      <p class="sr-only" id="live" aria-live="polite"></p>
    </section>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
